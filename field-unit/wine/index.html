<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0C0A">
<title>Wine Log</title>
<style>
  html, body { margin: 0; height: 100%; background: #0E0C0A; color: #EFE6D6; font: 16px/1.5 Georgia, serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; }
  h1 { font-weight: 400; font-size: 30px; margin: 0 0 12px; color: #C9A464; }
  p { max-width: 320px; margin: 0 0 10px; color: #CFC4B2; }
</style>
</head>
<body>
<main>
  <h1>Wine Log is resting</h1>
  <p>It has been set aside for now and will come back as its own app. Your tastings are kept safe with Command Deck.</p>
  <p>You can remove this icon from your Home Screen.</p>
</main>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (r.scope.endsWith('/wine/')) r.update(); }));</script>
</body>
</html>
