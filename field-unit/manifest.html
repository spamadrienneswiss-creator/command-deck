<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C11">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Project Manifest</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="manifest.css">
<link rel="stylesheet" href="boot.css">

<body data-theme="dusk" data-frame="dark" data-trim="none" class="pm-body">
<!-- Load-up screen ("Signal"). Inline so the boot log paints before any script runs; boot.js takes it from here. -->
<div id="boot" class="boot s1" aria-hidden="true" data-chip="DECK RELAY" data-align="OPENING PROJECT" data-scan="REACHING THE DECK" data-rows="PROJECT,TASKS,SUBTASKS,NOTES,CREW,RELAY" data-handoff="Opening the project">
  <i class="sb-c tl"></i><i class="sb-c tr"></i><i class="sb-c bl"></i><i class="sb-c br"></i>
  <section class="sb-st sb-log">
    <div class="sb-mbox"><svg class="sb-mark" viewBox="0 0 11 7" aria-hidden="true"><path d="M1 0h4v1h-4z M0 1h1v5h-1z M1 6h4v1h-4z M6 0h4v1h-4z M6 1h1v5h-1z M10 1h1v5h-1z M6 6h4v1h-4z" fill="currentColor"/></svg></div>
    <div class="sb-lines"><div class="hd">DECK RELAY // SHARED PROJECT</div><div class="sub" data-sub>OPENING THE PROJECT...</div><div data-lines></div></div>
  </section>
  <section class="sb-st sb-align"></section>
  <section class="sb-st sb-radar"></section>
  <section class="sb-st sb-lock"></section>
  <div class="sb-foot">DECK RELAY · SHARED LINK</div>
</div>
<div id="pm" class="pm"></div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="manifest.js"></script>
</body>
</html>
