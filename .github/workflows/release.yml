# Builds and ships a new version whenever main gets a version number that hasn't been released yet
# (npm run bump -- 1.11.1, commit, push). Pushes that don't change the version just run the checks.
#   0. version: is package.json's version already a release?
#   1. checks: unit tests + the Firestore security rules (a release stops here if anything fails)
#   2. windows: builds the installer and publishes it as a GitHub Release. Command Deck
#      checks these releases and updates itself.
#   3. field-unit: publishes Field Unit, the shared-link pages and the security rules to Firebase.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "$tag is already released; checks only."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Releasing $tag."
          fi

  checks:
    uses: ./.github/workflows/checks.yml

  windows:
    needs: [version, checks]
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "::error::package.json says $v but the tag is $GITHUB_REF_NAME"; exit 1; fi
      - name: Build installer and publish the release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  field-unit:
    needs: [version, checks, windows]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-field.js
      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
            [ -n "$FIREBASE_PROJECT" ] || FIREBASE_PROJECT=$(node -p "require(process.env.GOOGLE_APPLICATION_CREDENTIALS).project_id")
          elif [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning title=Field Unit not published::Add the FIREBASE_SERVICE_ACCOUNT secret so releases also update Field Unit. The Windows update shipped."
            exit 0
          fi
          if [ -z "$FIREBASE_PROJECT" ]; then echo "::error::Set the FIREBASE_PROJECT variable (your Firebase project ID)."; exit 1; fi
          npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/firebase-key.json"
