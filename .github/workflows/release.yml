# Builds and ships a new version whenever main gets a version number that hasn't been released yet
# (npm run bump -- 1.11.1, commit, push). Pushes that don't change the version just run the checks.
#   0. version: is package.json's version already a release?
#   1. checks: unit tests + the Firestore security rules (a release stops here if anything fails)
#   2. windows: builds the installer and publishes it as a GitHub Release. Command Deck
#      checks these releases and updates itself.
#   3. field-unit: publishes Field Unit, the shared-link pages and the security rules to Firebase.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Released = published and carrying latest.yml (what installed copies read to find updates).
          done=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '(.isDraft | not) and ([.assets[].name] | index("latest.yml") != null)' 2>/dev/null || echo false)
          if [ "$done" = "true" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "$tag is already released; checks only."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Releasing $tag."
          fi

  checks:
    uses: ./.github/workflows/checks.yml

  windows:
    needs: [version, checks]
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "::error::package.json says $v but the tag is $GITHUB_REF_NAME"; exit 1; fi
      - name: Build the installer
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --win nsis --publish never 2>&1 | tee build.log; then
            # Surface the end of the log as an annotation, so the failure can be read on the run page.
            msg=$(tail -n 40 build.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Installer build failed::$msg"
            exit 1
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -e
          ls -la release
          files=(release/*.exe release/*.exe.blockmap release/latest.yml)
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }; done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            git log -1 --pretty=%B > notes.txt
            gh release create "$TAG" --title "Command Deck $TAG" --notes-file notes.txt --target "$GITHUB_SHA" --draft
          fi
          # latest.yml goes up last: installed copies only see the update once everything it points to is there.
          gh release upload "$TAG" release/*.exe release/*.exe.blockmap --clobber
          gh release upload "$TAG" release/latest.yml --clobber
          gh release edit "$TAG" --draft=false --latest

  field-unit:
    # Runs after a release, and on any push while the live Field Unit is behind package.json.
    needs: [version, checks, windows]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT }}
          WANT: ${{ needs.version.outputs.tag }}
        run: |
          fail() {
            msg=$(tail -n 40 "${1:-deploy.log}" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Field Unit deploy failed::$msg"; exit 1
          }
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
            [ -n "$FIREBASE_PROJECT" ] || FIREBASE_PROJECT=$(node -p "require(process.env.GOOGLE_APPLICATION_CREDENTIALS).project_id" 2>/dev/null) \
              || { echo "The FIREBASE_SERVICE_ACCOUNT secret isn't a valid key file (paste the whole .json)." > deploy.log; fail; }
          elif [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning title=Field Unit not published::Add the FIREBASE_SERVICE_ACCOUNT secret so releases also update Field Unit."
            exit 0
          fi
          [ -n "$FIREBASE_PROJECT" ] || { echo "Set the FIREBASE_PROJECT variable (your Firebase project ID)." > deploy.log; fail; }
          live=$(curl -fsS "https://$FIREBASE_PROJECT.web.app/version.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log('v'+JSON.parse(s).version)}catch(e){console.log('none')}})")
          echo "Live Field Unit: $live · this build: $WANT"
          if [ "$live" = "$WANT" ] && [ "${{ needs.version.outputs.new }}" != "true" ]; then echo "Field Unit is already up to date."; exit 0; fi
          npm ci > deploy.log 2>&1 || fail
          node scripts/build-field.js >> deploy.log 2>&1 || fail
          npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive > deploy.log 2>&1 || fail
          tail -n 15 deploy.log
          rm -f "$RUNNER_TEMP/firebase-key.json"
