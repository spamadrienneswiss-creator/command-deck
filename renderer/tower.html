<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'">
<title>Comm Tower 1</title>
<link rel="stylesheet" href="../node_modules/@fontsource/chakra-petch/latin-400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/chakra-petch/latin-600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/latin-500.css">
<link rel="stylesheet" href="tower.css">
</head>
<body data-stage="idle">
<div class="tw">
  <div class="tw-card" id="card" hidden>
    <span class="tw-hair" aria-hidden="true"></span>
    <div class="tw-head"><span class="tw-dot" aria-hidden="true"></span><span class="tw-who" id="who">YOU</span><span class="tw-src" id="src"></span><span class="tw-time" id="time">LIVE</span></div>
    <div class="tw-wave" id="wave" aria-hidden="true"></div>
    <div class="tw-text" id="text" aria-live="polite"></div>
    <div class="tw-tags" id="tags"></div>
  </div>
  <span class="tw-link" id="link" aria-hidden="true" hidden></span>
  <button type="button" class="tw-chip" id="chip" aria-label="Talk to Comm Tower 1">
    <span class="tw-chair" aria-hidden="true"></span>
    <span class="tw-portrait" aria-hidden="true"><span class="tw-halo"></span><span class="tw-voice" id="voice"></span></span>
    <span class="tw-names"><span class="tw-name" id="name">COMM TOWER 1</span><span class="tw-sub" id="sub">STANDING BY</span></span>
    <span class="tw-side" aria-hidden="true"><span class="tw-live"></span><span class="tw-line">LINE 01</span></span>
  </button>
</div>
<script type="module" src="tower.js"></script>
</body>
</html>
