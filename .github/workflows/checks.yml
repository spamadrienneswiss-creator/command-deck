# Tests and the Firestore security rules check. The Release workflow runs this on every push to main,
# before anything ships.
name: Checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The calendar tests read times the way Command Deck shows them, in the home time zone.
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Unit tests
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            # Surface the failing check on the run page.
            msg=$(grep -v '^\s*at ' test.log | tail -n 30 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Unit tests failed::$msg"
            exit 1
          fi
      - name: Firestore security rules
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-command-deck "node test/rules-test.mjs"
